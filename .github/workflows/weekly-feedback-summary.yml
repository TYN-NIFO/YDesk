name: Weekly feedback summary

on:
  schedule:
    - cron: '30 12 * * 5'
    - cron: '0 13 * * 5'
    - cron: '30 13 * * 5'
  workflow_dispatch:
    inputs:
      send:
        description: Send real emails (requires the enable variable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-feedback-summary
  cancel-in-progress: false

jobs:
  summary:
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_SUMMARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate weekly feedback summary
        env:
          WEEKLY_SUMMARY_API_URL: ${{ vars.WEEKLY_SUMMARY_API_URL }}
          WEEKLY_SUMMARY_JOB_TOKEN: ${{ secrets.WEEKLY_SUMMARY_JOB_TOKEN }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send }}
        run: node .github/scripts/run-weekly-summary.mjs
